alias 1 "bind kp_ins 1; update_cfg; echo Sound selected: Alpha"
alias 2 "bind kp_ins 2; update_cfg; echo Sound selected: beta song"
alias 3 "bind kp_ins 3; update_cfg; echo Sound selected: Gamma-3"
