version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      naudio:
        patterns: ['NAudio*']
      test-stack:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
