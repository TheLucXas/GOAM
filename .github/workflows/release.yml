name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $version) { throw "Tag v$tag does not match Directory.Build.props Version $version" }

      - name: Build and test
        run: |
          dotnet restore GOAM.sln
          dotnet build GOAM.sln -c Release --no-restore
          dotnet test tests/GOAM.Core.Tests/GOAM.Core.Tests.csproj -c Release --no-build

      - name: Publish
        run: >
          dotnet publish src/GOAM.App/GOAM.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o out/publish

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/publish/GOAM.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GOAM.exe" | Out-File -Encoding ascii out/publish/SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "No section for $version in CHANGELOG.md" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[').LineNumber | Select-Object -First 1
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Set-Content -Encoding utf8 release-notes.md

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' `
            out/publish/GOAM.exe out/publish/SHA256SUMS.txt `
            --title 'GOAM ${{ github.ref_name }}' `
            --notes-file release-notes.md `
            --verify-tag
