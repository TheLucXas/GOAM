name: CI

on:
  push:
    branches: [develop, main]
    tags-ignore: ['v*']   # tags are handled by release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GOAM.sln

      - name: Build
        run: dotnet build GOAM.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/GOAM.Core.Tests/GOAM.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/GOAM.App/GOAM.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o out/publish

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/publish/GOAM.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GOAM.exe" | Out-File -Encoding ascii out/publish/SHA256SUMS.txt
          Get-Content out/publish/SHA256SUMS.txt

      - name: Upload GOAM.exe
        uses: actions/upload-artifact@v7
        with:
          name: GOAM-win-x64
          path: |
            out/publish/GOAM.exe
            out/publish/SHA256SUMS.txt
          if-no-files-found: error
